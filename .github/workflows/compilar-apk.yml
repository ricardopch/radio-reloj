# Compila la app Android en los servidores de GitHub y publica el APK en "Releases".
# Se ejecuta sola cada vez que se suben cambios a la rama main, o a mano desde la pestaña Actions.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RadioReloj.apk

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioReloj-apk
          path: android-app/RadioReloj.apk

      - name: Publicar en Releases
        working-directory: android-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" RadioReloj.apk \
            --title "Radio Reloj (compilación ${{ github.run_number }})" \
            --notes "Abre este enlace en el móvil, descarga RadioReloj.apk e instálalo."
