plugins {
    id 'com.android.application'
}

android {
    namespace = 'es.radioreloj.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'es.radioreloj.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 4
        versionName = '1.3'
    }

    // Firma fija incluida en el proyecto: así cada APK nuevo se instala encima del anterior
    // sin tener que desinstalar (da igual si se compila en GitHub o en Android Studio).
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storeType = 'pkcs12'
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Media3 marca algunas clases como "UnstableApi"; para una app personal es seguro usarlas.
        disable.add('UnsafeOptInUsageError')
        abortOnError = false
    }
}

dependencies {
    def media3 = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation 'androidx.webkit:webkit:1.12.1'
}
